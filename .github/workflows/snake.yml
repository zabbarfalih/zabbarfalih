name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: zabbarfalih
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=ff3b4e&color_dots=150d26,3b2a63,7a2a5e,c23a7a,ff5fd2&color_dot_border=0b0614&color_background=0b0614

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
